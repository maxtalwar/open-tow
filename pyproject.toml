[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-tow"
version = "0.2.0"
description = "An independent digital reconstruction inspired by the CSIS Taiwan Operational Wargame"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Open TOW contributors" }]
keywords = ["wargaming", "simulation", "multi-agent", "national-security", "operations-research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.scripts]
open-tow = "opentow.api:main"
open-tow-sim = "opentow.cli:main"

[tool.setuptools]
packages = ["opentow"]

